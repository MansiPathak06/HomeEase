services:
  - type: web
    name: homeease-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://homeease-lla9.onrender.com/api

      - key: NEXT_PUBLIC_WS_URL
        value: wss://homeease-lla9.onrender.com